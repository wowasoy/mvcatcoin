<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#001a0f">
  <meta name="description" content="MVCatCoin - ERC20 governance token and staking pool">
  <title>MVCatCoin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='56' fill='%23a8ff1a'/%3E%3Ctext x='128' y='164' font-family='Arial' font-size='128' font-weight='300' text-anchor='middle' fill='%236e6e6e'%3EMV%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main>
    <header class="hero glass">
      <svg
        class="logo"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 256 256"
        width="96"
        height="96"
        role="img"
        aria-label="MVCatCoin logo"
      >
        <defs>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a8ff1a"/>
            <stop offset="100%" stop-color="#7fff00"/>
          </linearGradient>
          <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#9a9a9a"/>
            <stop offset="100%" stop-color="#6e6e6e"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bgGrad)"/>
        <text
          x="128"
          y="164"
          font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="128"
          font-weight="300"
          letter-spacing="-4"
          text-anchor="middle"
          fill="url(#textGrad)"
        >MV</text>
      </svg>
      <h1>MVCatCoin</h1>
      <p class="subtitle">ERC20 Governance Token &amp; Staking Pool</p>
      <p class="tag">MVCAT &middot; DeFi 2026</p>
    </header>

    <section class="card glass">
      <h2>Wallet</h2>
      <button id="connect" class="btn-primary">Connect Wallet</button>
      <p id="account" class="mono">Not connected</p>
    </section>

    <section class="card glass">
      <h2>Token Info</h2>
      <label for="tokenAddress">Contract Address</label>
      <input id="tokenAddress" type="text" placeholder="0x..." autocomplete="off" spellcheck="false">
      <button id="loadInfo" class="btn-primary">Load Info</button>
      <div id="tokenInfo" class="mono"></div>
    </section>

    <section class="card glass">
      <h2>Staking</h2>
      <label for="stakingAddress">Staking Contract</label>
      <input id="stakingAddress" type="text" placeholder="0x..." autocomplete="off" spellcheck="false">
      <label for="stakeAmount">Amount (wei)</label>
      <input id="stakeAmount" type="text" placeholder="1000000000000000000" autocomplete="off" spellcheck="false">
      <div class="row">
        <button id="stake" class="btn-primary">Stake</button>
        <button id="withdraw" class="btn-ghost">Withdraw</button>
        <button id="claim" class="btn-ghost">Claim</button>
      </div>
      <p id="stakingStatus" class="mono"></p>
    </section>

    <footer class="glass">
      <p class="mono">MIT &middot; MVCatCoin &middot; 2026</p>
    </footer>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
